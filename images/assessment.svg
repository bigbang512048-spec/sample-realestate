<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" role="img" aria-label="無料査定イメージ（イラスト・プレースホルダー）">
  <defs>
    <linearGradient id="asky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182544"/>
      <stop offset="100%" stop-color="#0d1526"/>
    </linearGradient>
  </defs>

  <circle cx="400" cy="360" r="300" fill="url(#asky)"/>

  <!-- 地面 -->
  <ellipse cx="400" cy="560" rx="260" ry="26" fill="rgba(0,0,0,0.3)"/>

  <!-- 家1 -->
  <g>
    <rect x="200" y="420" width="150" height="110" fill="#e7d9bc"/>
    <polygon points="188,420 275,352 362,420" fill="#8f4530"/>
    <rect x="248" y="464" width="34" height="66" fill="#5c3623"/>
    <rect x="300" y="446" width="30" height="28" fill="#ffdb8a"/>
    <rect x="300" y="446" width="30" height="28" fill="none" stroke="#3a2f22" stroke-width="2"/>
  </g>

  <!-- 家2 -->
  <g>
    <rect x="380" y="392" width="180" height="138" fill="#d8dcc9"/>
    <polygon points="366,392 470,312 574,392" fill="#28394f"/>
    <rect x="440" y="446" width="40" height="84" fill="#3a2c22"/>
    <rect x="398" y="416" width="34" height="30" fill="#ffdb8a"/>
    <rect x="398" y="416" width="34" height="30" fill="none" stroke="#3a2f22" stroke-width="2"/>
    <rect x="500" y="416" width="34" height="30" fill="#ffdb8a"/>
    <rect x="500" y="416" width="34" height="30" fill="none" stroke="#3a2f22" stroke-width="2"/>
  </g>

  <!-- 書類・クリップボード -->
  <g>
    <rect x="150" y="530" width="120" height="150" rx="8" fill="#121b32" stroke="#2a3552" stroke-width="3"/>
    <rect x="188" y="520" width="44" height="20" rx="6" fill="#c9a668"/>
    <line x1="172" y1="568" x2="248" y2="568" stroke="#2a3552" stroke-width="6"/>
    <line x1="172" y1="592" x2="248" y2="592" stroke="#2a3552" stroke-width="6"/>
    <line x1="172" y1="616" x2="230" y2="616" stroke="#2a3552" stroke-width="6"/>
    <path d="M180,650 l14,14 l28,-30" fill="none" stroke="#4a9c5d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 虫眼鏡 -->
  <g>
    <circle cx="520" cy="470" r="95" fill="rgba(201,166,104,0.14)" stroke="#c9a668" stroke-width="14"/>
    <line x1="588" y1="538" x2="660" y2="610" stroke="#c9a668" stroke-width="22" stroke-linecap="round"/>
    <line x1="588" y1="538" x2="660" y2="610" stroke="#0b1226" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- 円マーク -->
  <circle cx="520" cy="470" r="46" fill="#121b32"/>
  <text x="520" y="488" text-anchor="middle" font-family="sans-serif" font-size="46" font-weight="800" fill="#e2c78f">￥</text>
