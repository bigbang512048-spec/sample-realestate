<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" role="img" aria-label="無料査定イメージ（イラスト・プレースホルダー）">
  <defs>
    <linearGradient id="asky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eef1f5"/>
      <stop offset="100%" stop-color="#e2e7ee"/>
    </linearGradient>
  </defs>

  <circle cx="400" cy="360" r="300" fill="url(#asky)"/>

  <!-- 地面 -->
  <ellipse cx="400" cy="560" rx="260" ry="26" fill="rgba(22,35,63,0.08)"/>

  <!-- 家1 -->
  <g>
    <rect x="200" y="420" width="150" height="110" fill="#f4ead9"/>
    <polygon points="188,420 275,352 362,420" fill="#b5573c"/>
    <rect x="248" y="464" width="34" height="66" fill="#7a4b32"/>
    <rect x="300" y="446" width="30" height="28" fill="#eef6fb" stroke="#c9d3da" stroke-width="2"/>
  </g>

  <!-- 家2 -->
  <g>
    <rect x="380" y="392" width="180" height="138" fill="#eef2ea"/>
    <polygon points="366,392 470,312 574,392" fill="#33455f"/>
    <rect x="440" y="446" width="40" height="84" fill="#5c4632"/>
    <rect x="398" y="416" width="34" height="30" fill="#eef6fb" stroke="#c9d3da" stroke-width="2"/>
    <rect x="500" y="416" width="34" height="30" fill="#eef6fb" stroke="#c9d3da" stroke-width="2"/>
  </g>

  <!-- 書類・クリップボード -->
  <g>
    <rect x="150" y="530" width="120" height="150" rx="8" fill="#ffffff" stroke="#dfe3e9" stroke-width="3"/>
    <rect x="188" y="520" width="44" height="20" rx="6" fill="#b3924f"/>
    <line x1="172" y1="568" x2="248" y2="568" stroke="#dfe3e9" stroke-width="6"/>
    <line x1="172" y1="592" x2="248" y2="592" stroke="#dfe3e9" stroke-width="6"/>
    <line x1="172" y1="616" x2="230" y2="616" stroke="#dfe3e9" stroke-width="6"/>
    <path d="M180,650 l14,14 l28,-30" fill="none" stroke="#6fa85a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 虫眼鏡 -->
  <g>
    <circle cx="520" cy="470" r="95" fill="rgba(179,146,79,0.14)" stroke="#b3924f" stroke-width="14"/>
    <line x1="588" y1="538" x2="660" y2="610" stroke="#b3924f" stroke-width="22" stroke-linecap="round"/>
    <line x1="588" y1="538" x2="660" y2="610" stroke="#16233f" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- 円マーク -->
  <circle cx="520" cy="470" r="46" fill="#ffffff"/>
  <text x="520" y="488" text-anchor="middle" font-family="sans-serif" font-size="46" font-weight="800" fill="#16233f">￥</text>
</svg>
